## The default memory manager (--mm:orc) adds a cyclic garbage collector on
## top of ARC. We've hit a SIGSEGV inside that cycle collector itself
## (orc.nim's rememberCycle/unregisterCycle, called from a plain route
## lookup) using the current nim-#devel toolchain — this looks like a
## toolchain/runtime bug in ORC's cycle detection, not something reachable
## from application-level code. Since this project doesn't intentionally
## create reference cycles, switching to --mm:arc (same deterministic
## reference counting, but with no cycle collector) sidesteps that code
## path entirely.
--mm:arc
